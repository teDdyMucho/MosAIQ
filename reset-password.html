<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set a new password — RavMizAI</title><meta name="theme-color" content="#0C2147"><link rel="stylesheet" href="assets/styles.css"></head><body>
<div class="authPage"><div class="authBox">
<div class="authLogo"><a class="brand" href="index.html"><img src="assets/logo-mark.png" alt="" width="47" height="48"><span>RavMiz<b>AI</b></span></a><div style="color:var(--muted);font-size:13px;margin-top:8px">Choose a new password</div></div>
<div class="authCard">
<h1>Set a new password</h1>
<div class="sub" id="resetFor">Enter a new password for your account.</div>
<div id="formError" class="error"></div>
<div id="formSuccess" class="success"></div>
<form id="resetForm">
<div class="field"><label>New password</label><div class="pwWrap"><input class="input" name="password" type="password" autocomplete="new-password" required><button type="button" class="pwToggle" aria-label="Show password" aria-pressed="false"><svg class="eyeOn" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eyeOff" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-3.2 4"/><path d="M6.2 6.2A18 18 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.85"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg></button></div></div>
<div class="passwordRules"><span>✓ At least 10 characters</span><span>✓ Use uppercase, lowercase, a number and a special character</span></div>
<div class="field"><label>Confirm new password</label><div class="pwWrap"><input class="input" name="password2" type="password" autocomplete="new-password" required><button type="button" class="pwToggle" aria-label="Show password" aria-pressed="false"><svg class="eyeOn" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eyeOff" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-3.2 4"/><path d="M6.2 6.2A18 18 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.85"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg></button></div></div>
<button type="submit" class="btn btn-primary btn-full" style="margin-top:18px">Save new password</button>
</form>
<div class="authFoot"><a href="login.html">Back to sign in</a></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="assets/supabase-config.js"></script><script src="assets/auth.js"></script><script src="assets/app.js"></script></body></html>
