<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up — RavMizAI</title><meta name="theme-color" content="#0C2147"><link rel="stylesheet" href="assets/styles.css"></head><body>
<div class="authPage"><div class="authBox"><div class="authLogo"><a class="brand" href="index.html"><img src="assets/logo-mark.png" alt="" width="47" height="48"><span>RavMiz<b>AI</b></span></a><div style="color:var(--muted);font-size:12px;margin-top:8px">Create your account</div></div>
<div class="authCard"><h1>Create account</h1><div class="sub">Your account unlocks saved preferences and member access.</div><div id="formError" class="error"></div>
<form id="signupForm"><div class="row2"><div class="field"><label>First name</label><input class="input" name="first" required></div><div class="field"><label>Last name</label><input class="input" name="last" required></div></div><div class="field"><label>Email address</label><input class="input" name="email" type="email" required></div><div class="field"><label>Password</label><input class="input" name="password" type="password" required></div><div class="passwordRules"><span>✓ At least 10 characters</span><span>✓ Use uppercase, lowercase, a number and a special character</span></div>
<input type="hidden" name="next" value="app/home.html"><label class="checkline"><input type="checkbox" name="agree"> I agree to the <a href="terms.html" target="_blank" style="color:var(--gold2)">Terms of Service</a> and <a href="privacy.html" target="_blank" style="color:var(--gold2)">Privacy Policy</a>.</label><button class="btn btn-primary btn-full" style="margin-top:18px">Create account</button></form><div class="divider">OR</div><button class="btn btn-outline btn-full" type="button" disabled title="Google sign-in is not configured yet" style="opacity:.45;cursor:not-allowed">Continue with Google</button></div>
<div class="authFoot">Already have an account? <a href="login.html">Sign in</a></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="assets/supabase-config.js"></script><script src="assets/auth.js"></script><script src="assets/app.js"></script></body></html>
