<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — RavMizAI</title><meta name="theme-color" content="#0C2147"><link rel="stylesheet" href="assets/styles.css"></head><body>
<div class="authPage"><div class="authBox"><div class="authLogo"><a class="brand" href="index.html"><img src="assets/logo-mark.png" alt="" width="47" height="48"><span>RavMiz<b>AI</b></span></a><div style="color:var(--muted);font-size:12px;margin-top:8px">Sign in to your account</div></div>
<div class="authCard"><h1>Welcome back</h1><div class="sub">Continue your Torah conversation.</div><div id="formError" class="error"></div>
<form id="loginForm"><div class="field"><label>Email address</label><input class="input" name="email" type="email" required></div><div class="field"><label>Password</label><div class="pwWrap"><input class="input" name="password" type="password" autocomplete="current-password" required><button type="button" class="pwToggle" aria-label="Show password" aria-pressed="false"><svg class="eyeOn" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eyeOff" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-3.2 4"/><path d="M6.2 6.2A18 18 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.85"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg></button></div></div><label class="checkline"><input type="checkbox" checked> Remember me on this device</label><div style="text-align:right;margin-top:10px"><a href="forgot-password.html" style="font-size:12px;color:var(--gold2)">Forgot password?</a></div><button type="submit" class="btn btn-primary btn-full" style="margin-top:18px">Continue with email</button></form><div class="divider">OR</div><button class="btn btn-outline btn-full" type="button" disabled title="Google sign-in is not configured yet" style="opacity:.45;cursor:not-allowed">Continue with Google</button></div>
<div class="authFoot">Don't have an account? <a href="signup.html">Sign up</a></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="assets/supabase-config.js"></script><script src="assets/auth.js"></script><script src="assets/app.js"></script></body></html>
